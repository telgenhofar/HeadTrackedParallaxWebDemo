<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>parallax</title>
  </head>
  <body>
    <div id="toolbar">
      <button id="settings-button" title="Screen size">&#9881;</button>
      <button id="fullscreen-button" title="Fullscreen">&#9974;</button>
    </div>
    <dialog id="calibration-modal">
      <h2>Screen size</h2>
      <p>Enter your screen's diagonal so the scene renders at real-world scale.</p>
      <div class="row">
        <input id="diagonal" type="number" min="1" step="0.1" value="15.6">
        <select id="unit">
          <option value="in">in</option>
          <option value="cm">cm</option>
        </select>
      </div>
      <button id="modal-close">Continue</button>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
